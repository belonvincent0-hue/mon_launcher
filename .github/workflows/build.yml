name: Build NumWorks App

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout user repository
        uses: actions/checkout@v4
        with:
          path: user_repo

      - name: Install ARM Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi make git

      - name: Build with Official Template
        run: |
          # Cloner le modèle officiel NumWorks
          git clone --depth 1 https://github.com/numworks/epsilon-sample-app-cpp.git sample_app
          
          # Remplacer le main.cpp du modèle par le tien
          if [ -f user_repo/main.cpp ]; then
            cp user_repo/main.cpp sample_app/src/main.cpp
          fi
          
          # Compiler à l'intérieur du modèle officiel
          cd sample_app
          mkdir -p output
          make BUILD_DIR=output
          
          # Récupérer le fichier .nwa généré
          cd ..
          mkdir -p output
          cp sample_app/output/*.nwa output/mon_launcher.nwa

      - name: Upload .nwa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonLauncher-nwa
          path: output/mon_launcher.nwa
