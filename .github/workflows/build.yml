name: Build NumWorks App

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: numworks/eadk:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build App
        run: make

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-nwa
          path: output/*.nwa
