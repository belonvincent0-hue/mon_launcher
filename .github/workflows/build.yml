name: Build NumWorks App

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi make

      - name: Get EADK SDK
        run: |
          git clone https://github.com/numworks/eadk.git eadk_sdk

      - name: Build App
        run: |
          make -f eadk_sdk/eadk.mk BUILD_DIR=build NWLINK_PATH=eadk_sdk/target/eadk.nwa

      - name: Upload .nwa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonLauncher-nwa
          path: build/*.nwa
