name: Build NumWorks App

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ARM Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi make

      - name: Build with EADK
        run: |
          git clone https://github.com/numworks/eadk.git eadk_sdk
          make -f eadk_sdk/module.mak || make
