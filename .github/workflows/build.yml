name: Build NumWorks App

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi make git

      - name: Compile Application
        run: |
          git clone https://github.com/numworks/eadk.git eadk_folder
          # Compilation directe avec le compilateur ARM
          arm-none-eabi-g++ -O3 -Ieadk_folder -c main.cpp -o main.o
          arm-none-eabi-gcc -nostdlib main.o eadk_folder/target/eadk.a -o firmware.elf
          mkdir -p output
          # Génération du fichier .nwa final
          arm-none-eabi-objcopy -O binary firmware.elf output/mon_launcher.nwa

      - name: Upload .nwa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonLauncher-nwa
          path: output/mon_launcher.nwa
