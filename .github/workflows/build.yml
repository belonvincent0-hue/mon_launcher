name: Build NumWorks App

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mon Launcher
        uses: actions/checkout@v4

      - name: Checkout EADK SDK
        uses: actions/checkout@v4
        with:
          repository: numworks/eadk
          path: eadk

      - name: Install ARM Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi make

      - name: Build Application
        run: |
          mkdir -p output
          make -f eadk/eadk.mk \
            EADK_PATH=eadk \
            TARGET=output/mon_launcher.nwa \
            SOURCES="main.cpp"

      - name: Upload .nwa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonLauncher-nwa
          path: output/mon_launcher.nwa
