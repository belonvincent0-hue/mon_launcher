name: Build NumWorks App

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi make git

      - name: Setup Official Build Files
        run: |
          git clone --depth 1 https://github.com/numworks/epsilon-sample-app-cpp.git sample_app
          # On récupère le Makefile de base et le fichier app.json s'il te manque
          cp sample_app/Makefile Makefile
          if [ ! -f app.json ]; then cp sample_app/app.json .; fi
          rm -rf sample_app

      - name: Build Application
        run: |
          mkdir -p output
          make BUILD_DIR=output

      - name: Upload .nwa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonLauncher-nwa
          path: output/*.nwa
