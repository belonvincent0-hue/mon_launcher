name: Build NumWorks App

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi make curl unzip

      - name: Download and Build EADK
        run: |
          curl -L -o eadk.zip https://github.com/numworks/eadk/archive/refs/heads/master.zip
          unzip -q eadk.zip
          mv eadk-master eadk
          make -C eadk BUILD_DIR=../output

      - name: Upload .nwa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonLauncher-nwa
          path: output/*.nwa
