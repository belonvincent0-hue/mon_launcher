name: Build NumWorks App

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout user repository
        uses: actions/checkout@v4
        with:
          path: user_repo

      - name: Checkout Official Sample App with Submodules
        uses: actions/checkout@v4
        with:
          repository: numworks/epsilon-sample-app-cpp
          submodules: recursive
          path: sample_app

      - name: Install ARM Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi make

      - name: Build Application
        run: |
          # Remplacer le code d'exemple par ton main.cpp
          if [ -f user_repo/main.cpp ]; then
            cp user_repo/main.cpp sample_app/src/main.cpp
          fi
          
          # Compiler proprement
          cd sample_app
          mkdir -p output
          make BUILD_DIR=output

      - name: Export Artifact
        run: |
          mkdir -p output
          cp sample_app/output/*.nwa output/mon_launcher.nwa

      - name: Upload .nwa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonLauncher-nwa
          path: output/mon_launcher.nwa
