name: Build NumWorks App

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mon Launcher
        uses: actions/checkout@v4

      - name: Checkout NumWorks Sample App (SDK)
        uses: actions/checkout@v4
        with:
          repository: numworks/epsilon-sample-app-cpp
          path: sdk

      - name: Install ARM Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi make

      - name: Prepare SDK and Build
        run: |
          # Copie des fichiers d'en-tête et du Makefile du SDK EADK
          cp -r sdk/eadk .
          cp sdk/Makefile Makefile.eadk
          mkdir -p output
          make -f Makefile.eadk BUILD_DIR=output

      - name: Upload .nwa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonLauncher-nwa
          path: output/*.nwa
